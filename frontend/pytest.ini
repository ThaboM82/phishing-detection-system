[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    --tb=short
    --strict-markers
    -n auto
    --dist=loadfile
    -p no:warnings
    --cov=src
    --cov-report=term-missing
    --cov-omit=src/train.py,train_model.py,app.py
    --durations=10

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    asyncio: mark test as async test
    anyio: mark test as anyio async test
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks unit tests
    xdist_group: mark tests to run on the same worker process
